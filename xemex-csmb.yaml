# Xemex CSMB Modbus RTU server emulation.
# RS485 UART, Modbus holding-register map, CT current controls and EV charging limit.

web_server:
  sorting_groups:
    - id: sg_wallbox
      name: "Xemex CSMB"
      sorting_weight: 2

globals:
  # Abgeleiteter Wert: wird beim Boot und bei jeder Slider-Aenderung aus
  # ev_limit_w berechnet — KEIN eigener NVS-Restore (sonst ueberlebt ein
  # veralteter Wert den Slider-Restore und wird beim Limit-Ende angewendet)
  - id: ladebegrenzung_addon
    type: float
    initial_value: "1.0"
  - id: ev_user_limit_w
    type: float
    restore_value: true
    initial_value: "11500.0"
  - id: ev_budget_override_active
    type: bool
    initial_value: "false"
  - id: xemex_reading
    type: esphome::modbus_server::XemexReading
  - id: xemex_guard
    type: esphome::modbus_server::XemexChargeGuard
  - id: xemex_latched
    type: bool
    restore_value: true
    initial_value: "false"
  - id: xemex_sent_values
    type: std::array<float, 3>
  - id: xemex_sent_at
    type: uint32_t
    initial_value: "0"

# Boot: Slider und CT-Addons aus der persistenten Benutzergrenze ableiten
esphome:
  on_boot:
    - priority: 800.0
      then:
        - lambda: |-
            id(modbusserver)->set_read_only(true);
            id(modbusserver)->on_holding_response([](uint16_t start, uint16_t count, const uint8_t *data) {
              if (start > 0x500C || uint32_t(start) + count < 0x5012) return;
              for (size_t phase = 0; phase < 3; ++phase) {
                const size_t offset = (0x500C - start + phase * 2) * 2;
                const uint32_t raw = (uint32_t(data[offset]) << 24) | (uint32_t(data[offset + 1]) << 16) |
                                     (uint32_t(data[offset + 2]) << 8) | data[offset + 3];
                memcpy(&id(xemex_sent_values)[phase], &raw, sizeof(raw));
              }
              id(xemex_sent_at) = millis();
            });
    - priority: -100.0
      then:
        - lambda: |-
            float w = id(ev_user_limit_w);
            if (std::isnan(w)) w = 11500.0f;
            id(ev_limit_w).make_call().set_value(w).perform();

# TX=GPIO17 (DE/DI zum RS485-Chip), RX=GPIO18 (RO vom RS485-Chip)
uart:
  - id: intmodbus
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 9600
    stop_bits: 1
    data_bits: 8
    parity: EVEN

# ── Xemex CSMB Modbus-Server ─────────────────────────────────────────────────
modbus_server:
  - id: modbusserver
    uart_id: intmodbus
    address: 1
    holding_registers:
      - start_address: 0x4000   # Serial Number Part 1 "MX"
        default: 0x4D58
        number: 1

      - start_address: 0x4001   # Serial Number Part 2
        default: 0x5C6F
        number: 1

      - start_address: 0x4002   # Device Code
        default: 20802
        number: 1

      - start_address: 0x4003   # Device Address
        default: 0x1
        number: 1

      - start_address: 0x4004   # RS485 Baudrate Low
        default: 9600
        number: 1

      - start_address: 0x4005   # Protocol Version (FLOAT Hi)
        default: 0x3f80
        number: 1

      - start_address: 0x4006   # Protocol Version (FLOAT Lo)
        default: 0x0000
        number: 1

      - start_address: 0x4007   # Software Version 2.5 (FLOAT Hi)
        default: 0x4020
        number: 1

      - start_address: 0x4008   # Software Version 2.5 (FLOAT Lo)
        default: 0x0000
        number: 1

      - start_address: 0x4009   # Hardware Version 1.0 (FLOAT Hi)
        default: 0x3F80
        number: 1

      - start_address: 0x400A   # Hardware Version 1.0 (FLOAT Lo)
        default: 0x0000
        number: 1

      - start_address: 0x400B   # Meter Amps
        default: 80
        number: 1

      - start_address: 0x400C   # CT Ratio
        default: 2000
        number: 1

      - start_address: 0x400D   # RS485 Line Settings
        default: 36
        number: 1

      - start_address: 0x400E   # RS485 Line Termination
        default: 1
        number: 1

      - start_address: 0x400F   # RS485 Baudrate High
        default: 0
        number: 1

      - start_address: 0x500C   # RMS Current CT1 (FLOAT Hi)
        default: 0x42A0
        number: 1

      - start_address: 0x500D   # RMS Current CT1 (FLOAT Lo)
        default: 0x0000
        number: 1

      - start_address: 0x500E   # RMS Current CT2 (FLOAT Hi)
        default: 0x42A0
        number: 1

      - start_address: 0x500F   # RMS Current CT2 (FLOAT Lo)
        default: 0x0000
        number: 1

      - start_address: 0x5010   # RMS Current CT3 (FLOAT Hi)
        default: 0x42A0
        number: 1

      - start_address: 0x5011   # RMS Current CT3 (FLOAT Lo)
        default: 0x0000
        number: 1

# ── EV Leistungsbegrenzung ────────────────────────────────────────────────────
# Kontinuierlicher W-Slider statt Dropdown — gleiche Behandlung wie die
# Leistungsgrenzen der anderen SteuVE. Umrechnung W -> Addon-Ampere:
#   amps  = W / 693        (3 Phasen x 231 V)
#   addon = 50 - amps - 2.6 - 2.40
#   2.40 A Vorsteuerung bilden 6 kW auf die gemessene 9-A-Stufe ab.
# Unter 8 A kann die Wallbox keinen stabilen Ladestrom einstellen. Diese
# Sollwerte (insbesondere das §14a-Maximum 4.200 W) werden sicher auf AUS
# abgebildet -> Addon 47.4 stoppt das Laden.
# ab ~11.4 kW gilt "unbegrenzt" (Addon 1.0, Fahrzeug limitiert selbst).
# Alle Stellwerte laufen durch xemex_update; DI1 und Simulation erzwingen AUS.
# EEBus begrenzt zusaetzlich auf den zugeteilten EV-Budgetanteil.
number:
  - platform: template
    disabled_by_default: false
    name: "${device_name} EV Leistungsbegrenzung"
    id: ev_limit_w
    icon: "mdi:ev-station"
    web_server:
      sorting_group_id: sg_wallbox
      sorting_weight: 10
    unit_of_measurement: "W"
    min_value: 0
    max_value: 11500
    step: 100
    initial_value: 11500
    restore_value: false
    optimistic: true
    mode: slider
    on_value:
      then:
        - lambda: |-
            if (!id(ev_budget_override_active)) {
              id(ev_user_limit_w) = x;
              if (id(hems_cs).is_limit_active()) id(distribute_budget).execute();
            }
        - script.execute: xemex_update

  # --- EV Budget-Verteilung (analog EG1/EG2, weights 11-13) ---
  - platform: template
    disabled_by_default: true
    name: "${device_name} EV Budget Priorität"
    id: ev_budget_prio
    icon: "mdi:sort-numeric-ascending"
    web_server:
      sorting_group_id: sg_wallbox
      sorting_weight: 11
    entity_category: config
    min_value: 1
    max_value: 9
    step: 1
    initial_value: 2
    restore_value: true
    optimistic: true

  - platform: template
    disabled_by_default: true
    name: "${device_name} EV Budget Sockel"
    id: ev_budget_min
    icon: "mdi:arrow-collapse-down"
    web_server:
      sorting_group_id: sg_wallbox
      sorting_weight: 12
    entity_category: config
    unit_of_measurement: "W"
    min_value: 0
    max_value: 11500
    step: 100
    initial_value: 0
    restore_value: true
    optimistic: true

  - platform: template
    disabled_by_default: true
    name: "${device_name} EV Budget Max"
    id: ev_budget_max
    icon: "mdi:arrow-collapse-up"
    web_server:
      sorting_group_id: sg_wallbox
      sorting_weight: 13
    entity_category: config
    unit_of_measurement: "W"
    min_value: 0
    max_value: 11500
    step: 100
    initial_value: 11000
    restore_value: true
    optimistic: true

# ── CT-Strom-Regler (Xemex Modbus-Register) ──────────────────────────────────
  - platform: template
    disabled_by_default: false
    name: "${device_name} CT1 Current"
    id: ct1current
    icon: "mdi:current-ac"
    web_server:
      sorting_group_id: sg_wallbox
      sorting_weight: 1
    optimistic: false
    update_interval: 2s
    min_value: 0
    max_value: 80
    step: 0.1
    unit_of_measurement: A
    set_action:
      then:
        - script.execute: xemex_update

  - platform: template
    disabled_by_default: false
    name: "${device_name} CT2 Current"
    id: ct2current
    icon: "mdi:current-ac"
    web_server:
      sorting_group_id: sg_wallbox
      sorting_weight: 2
    optimistic: false
    update_interval: 2s
    min_value: 0
    max_value: 80
    step: 0.1
    unit_of_measurement: A
    set_action:
      then:
        - script.execute: xemex_update

  - platform: template
    disabled_by_default: false
    name: "${device_name} CT3 Current"
    id: ct3current
    icon: "mdi:current-ac"
    web_server:
      sorting_group_id: sg_wallbox
      sorting_weight: 3
    optimistic: false
    update_interval: 2s
    min_value: 0
    max_value: 80
    step: 0.1
    unit_of_measurement: A
    set_action:
      then:
        - script.execute: xemex_update

  - platform: template
    disabled_by_default: true
    name: "${device_name} CT1 Addon"
    id: ct1addon
    icon: "mdi:plus-circle"
    web_server:
      sorting_group_id: sg_wallbox
      sorting_weight: 4
    min_value: 0
    max_value: 50
    step: 0.1
    optimistic: false
    unit_of_measurement: A
    initial_value: 0
    set_action:
      then:
        - script.execute: xemex_update

  - platform: template
    disabled_by_default: true
    name: "${device_name} CT2 Addon"
    id: ct2addon
    icon: "mdi:plus-circle"
    web_server:
      sorting_group_id: sg_wallbox
      sorting_weight: 5
    min_value: 0
    max_value: 50
    step: 0.1
    optimistic: false
    unit_of_measurement: A
    initial_value: 0
    set_action:
      then:
        - script.execute: xemex_update

  - platform: template
    disabled_by_default: true
    name: "${device_name} CT3 Addon"
    id: ct3addon
    icon: "mdi:plus-circle"
    web_server:
      sorting_group_id: sg_wallbox
      sorting_weight: 6
    min_value: 0
    max_value: 50
    step: 0.1
    optimistic: false
    unit_of_measurement: A
    initial_value: 0
    set_action:
      then:
        - script.execute: xemex_update

script:
  - id: xemex_update
    mode: single
    then:
      - lambda: |-
          const uint32_t now = millis();
          const float requested = esphome::modbus_server::xemex_limit(
              id(ev_user_limit_w), id(ev_limit_w).state, id(hems_cs).is_limit_active(),
              id(budget_last_ev), id(grid_provider_switch).state || id(manual_enwg_test).state);
          id(xemex_guard).latched = id(xemex_latched);
          const float watts = id(xemex_guard).step(requested, id(xemex_reading), now);
          id(xemex_latched) = id(xemex_guard).latched;
          id(xemex_effective_w).publish_state(std::isfinite(watts) ? watts : 0.0f);
          std::string status = id(xemex_guard).status;
          if (id(grid_provider_switch).state) status += " (DI1)";
          if (id(manual_enwg_test).state) status += " (Simulation)";
          if (id(xemex_status).state != status) id(xemex_status).publish_state(status);
          const auto report = esphome::modbus_server::xemex_report(watts, id(xemex_reading), now);
          const float addon = esphome::modbus_server::xemex_addon(watts);
          id(ladebegrenzung_addon) = addon;
          id(ct1addon).publish_state(addon);
          id(ct2addon).publish_state(addon);
          id(ct3addon).publish_state(addon);
          for (size_t phase = 0; phase < report.size(); ++phase) {
            uint32_t raw;
            memcpy(&raw, &report[phase], sizeof(raw));
            id(modbusserver)->write_holding_register(0x500C + phase * 2, raw >> 16);
            id(modbusserver)->write_holding_register(0x500D + phase * 2, raw & 0xFFFF);
          }
          id(ct1current).publish_state(report[0]);
          id(ct2current).publish_state(report[1]);
          id(ct3current).publish_state(report[2]);

interval:
  - interval: 1s
    then:
      - script.execute: xemex_update

text_sensor:
  - platform: template
    name: "${device_name} EV Regelstatus"
    id: xemex_status
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: sg_wallbox
      sorting_weight: 14
  - platform: template
    name: "${device_name} CSMB Letzte Stromantwort"
    entity_category: diagnostic
    update_interval: 5s
    web_server:
      sorting_group_id: sg_wallbox
      sorting_weight: 15
    lambda: |-
      if (id(xemex_sent_at) == 0) return {"Noch keine Stromantwort"};
      char values[80];
      snprintf(values, sizeof(values), "%.2f / %.2f / %.2f A", id(xemex_sent_values)[0],
               id(xemex_sent_values)[1], id(xemex_sent_values)[2]);
      return {values};

sensor:
  - platform: template
    name: "${device_name} EV Effektiver Sollwert"
    id: xemex_effective_w
    unit_of_measurement: W
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: "${device_name} EV Messwertalter"
    unit_of_measurement: s
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      const uint32_t now = millis();
      const auto &reading = id(xemex_reading);
      if (reading.power_updated == 0) return NAN;
      uint32_t age = now - reading.power_updated;
      for (const auto updated : reading.updated) {
        if (updated == 0) return NAN;
        age = std::max(age, now - updated);
      }
      return age / 1000.0f;
  - platform: template
    name: "${device_name} CSMB Anfragealter"
    unit_of_measurement: s
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 1s
    lambda: 'return id(modbusserver)->request_count() == 0 ? NAN : (millis() - id(modbusserver)->last_request_ms()) / 1000.0f;'
  - platform: template
    name: "${device_name} CSMB Stromantwortalter"
    unit_of_measurement: s
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 1s
    lambda: 'return id(xemex_sent_at) == 0 ? NAN : (millis() - id(xemex_sent_at)) / 1000.0f;'
  - platform: template
    name: "${device_name} CSMB CRC Fehler"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(modbusserver)->crc_errors();'
  - platform: template
    name: "${device_name} EV Ladeabbrueche 5min"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 1s
    lambda: 'return id(xemex_guard).stop_count();'

button:
  - platform: template
    name: "${device_name} EV Sperre zuruecksetzen"
    entity_category: config
    on_press:
      - lambda: |-
          if (id(xemex_guard).reset(id(ev_user_limit_w), id(xemex_reading), millis())) {
            id(xemex_latched) = false;
          } else {
            ESP_LOGW("modbus-server-xemex", "Entsperren abgelehnt: Benutzerlimit muss 0 W und Messung frisch/stromlos sein");
          }
      - script.execute: xemex_update
